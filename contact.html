<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Contact page for portfolio">

    <title>Contact - My Portfolio</title>

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <header>

        <h1>Contact Me</h1>

        <nav>

            <ul class="nav-list">

                <li><a href="index.html">Home</a></li>

                <li><a href="about.html">About</a></li>

                <li><a href="projects.html">Projects</a></li>

                <li><a href="contact.html" class="active">Contact</a></li>

            </ul>

        </nav>

    </header>

    <main>

        <section class="contact-form-section">

            <h2>Get In Touch</h2>

            <p>Fill in the form below and I will respond within 24 hours.</p>

            

            <form action="#" method="post" id="contactForm">

                <label for="name">Full Name:</label>

                <input type="text" id="name" name="name" required minlength="2" placeholder="Nolwazi Mrobongwane">



                <label for="email">Email Address:</label>

                <input type="email" id="email" name="email" required placeholder="you@example.com">



                <label for="phone">Phone Number:</label>

                <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="0123456789">



                <label for="contact-method">Preferred Contact Method:</label>

                <select id="contact-method" name="contact-method" required>

                    <option value="">-- Please choose --</option>

                    <option value="email">Email</option>

                    <option value="phone">Phone</option>

                </select>



                <fieldset>

                    <legend>Project Type:</legend>

                    <input type="radio" id="website" name="project-type" value="website" required>

                    <label for="website" class="inline-label">Website Build</label>

                    <input type="radio" id="audit" name="project-type" value="audit">

                    <label for="audit" class="inline-label">Accessibility Audit</label>

                </fieldset>



                <fieldset>

                    <legend>Services Interested In:</legend>

                    <input type="checkbox" id="design" name="services" value="design">

                    <label for="design" class="inline-label">Design</label>

                    <input type="checkbox" id="development" name="services" value="development">

                    <label for="development" class="inline-label">Development</label>

                </fieldset>



                <label for="message">Your Message:</label>

                <textarea id="message" name="message" rows="5" required minlength="10" placeholder="Tell me about your project..."></textarea>

                <button type="submit">Send Message</button>

            </form>

        </section>

    </main>

    <footer><p>&copy; 2025 Nolwazi Mrobongwane. All rights reserved.</p></footer>

</body>

</html>
